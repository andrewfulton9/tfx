#[build-system]
#requires = ["hatchling"]
#build-backend = "hatchling.build"
[build-system]
requires = ["setuptools>=72", "wheel", "tomli"]
build-backend = "setuptools.build_meta"

[project]
name = "tfx"
dynamic = ["version", "dependencies", "optional-dependencies", "scripts"]
description = "TensorFlow Extended (TFX) is a TensorFlow-based general-purpose machine learning platform implemented at Google."
readme = {file = "README.md", content-type="text/markdown"}
license = { file = "../LICENSE" }
authors = [
    { name = "Google LLC", email = "tensorflow-extended-dev@googlegroups.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = ["tensorflow", "tfx"]
requires-python = ">=3.9,<3.11"

dependencies = [
    "absl-py>=0.9,<2.0.0",
    "ml-metadata>=1.16.0,<1.17.0"    
    "packaging>=22",
    "portpicker>=1.3.1,<2",
    "protobuf>=3.20.3,<5",
    "docker>=7,<8",
    "google-apitools>=0.5,<1",
    "google-api-python-client>=1.8,<2",
    # TODO(b/176812386): Deprecate usage of jinja2 for placeholders.
    "jinja2>=2.7.3,<4",
    # Upper bound is <5 as the semver started from 4.0 according to their doc.
    "typing-extensions<5",
]


[project.urls]
Homepage = "https://www.tensorflow.org/tfx"
Repository = "https://github.com/tensorflow/tfx"

[project.optional-dependencies]
nightly = [
    "ml-metadata>=1.17.0.dev",
    "tensorflow-data-validation>=1.16.1.dev",
    "tensorflow-model-analysis>=0.47.0.dev",
    "tensorflow-transform>=1.16.0.dev",
    "tfx-bsl>=1.16.0.dev",
]
git_master = [
    "ml-metadata @ git+https://github.com/google/ml-metadata@master",
    "tensorflow-data-validation @ git+https://github.com/tensorflow/data-validation@master",
    "tensorflow-model-analysis @ git+https://github.com/tensorflow/model-analysis@master",
    "tensorflow-transform @ git+https://github.com/tensorflow/transform@master",
    "tfx-bsl @ git+https://github.com/tensorflow/tfx-bsl@master",
]
tfx = [
    "apache-beam[gcp]>=2.47,<3",
    "attrs>=19.3.0,<24",
    "click>=7,<9",
    "google-api-core<3",
    "google-cloud-aiplatform>=1.6.2,<2",
    "google-cloud-bigquery>=3,<4",
    "grpcio>=1.28.1,<2",
    "keras-tuner>=1.0.4,<2,!=1.4.0,!=1.4.1",
    "kubernetes>=10.0.1,<27",
    "numpy>=1.16,<2",
    "pyarrow>=10,<11",
    # TODO: b/358471141 - Orjson 3.10.7 breaks TFX OSS tests.
    # Unpin once the issue with installation is resolved.
    "orjson!=3.10.7",
    # TODO(b/332616741): Scipy version 1.13 breaks the TFX OSS test.
    # Unpin once the issue is resolved.
    "scipy<1.13",
    "scikit-learn==1.5.1",
    # TODO(b/291837844): Pinned pyyaml to 5.3.1.
    # Unpin once the issue with installation is resolved.
    "pyyaml>=6,<7",
    # Keep the TF version same as TFT to help Pip version resolution.
    # Pip might stuck in a TF 1.15 dependency although there is a working
    # dependency set with TF 2.x without the sync.
    # pylint: disable=line-too-long
    "tensorflow>=2.16.0,<2.17",
    # pylint: enable=line-too-long
    "tensorflow-hub>=0.15.0,<0.16",
    "tensorflow-data-validation>=1.16.1,<1.17.0",
    "tensorflow-model-analysis>=0.47.0,<0.48.0",
    "tensorflow-serving-api>=2.16,<2.17",
    "tensorflow-transform>=1.16.0,<1.17.0",
    "tfx-bsl>=1.16.1,<1.17.0",
]
airflow = [
    "apache-airflow[mysql]>=1.10.14,<3",
]
kfp = [
    "kfp>=2",
    "kfp-pipeline-spec>=0.2.2",
]
test = [
    # include kfp
    "pytest>=5,<=8",
    "pytest-subtests==0.13.1",
]
docker = [
    # include kfp
    "python-snappy>=0.7",
    # Required for tfx/examples/penguin/penguin_utils_cloud_tuner.py
    "tensorflow-cloud>=0.1,<0.2",
    "tensorflow-io>=0.9.0, <=0.24.0",
]
tfjs = [
    "tensorflowjs>=4.5,<5",
]
tflite_support = [
    "flatbuffers>=1.12",
    "tflite-support>=0.4.3,<0.4.5",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = "tfx"
python_files = "*_test.py"
norecursedirs = ["custom_components", ".*", "*.egg", "tfx/orchestration/experimental/core"]
markers = [
    "e2e: end-to-end tests which are slow and require more dependencies (deselect with '-m \"not end_to_end\"')",
    "serial: mark tests that should not run in parallel",
    "integration: integration tests that are slow and require more dependencies (deselect with `-m 'not integration'`)",
    "perf: performance 'perf' tests that are slow and require more dependencies (deselect with `-m 'not perf'`)",
]

[tool.cibuildwheel]
platform=auto
build=["cp39", "cp310"]
build_frontend=build
before_build="${which bazel} run --compilation_mode opt //build:gen_proto"
enable=[tfx]



